[project]
name = "dfs-companion"
version = "0.1.0"
description = "Personal DFS data pipeline: sync scrapers into Google Sheets, export DK lineups, track results and bankroll."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "gspread>=6.1",
    "google-auth>=2.29",
    "httpx>=0.27",
    "playwright>=1.44",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-httpx>=0.30",
]

[project.scripts]
dfs = "dfs.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
