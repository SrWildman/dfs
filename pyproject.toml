[project]
name = "dfs-companion"
version = "0.1.0"
description = "Personal DFS data pipeline: sync scrapers into Google Sheets, export DK lineups, track results and bankroll."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "gspread>=6.1",
    "google-auth>=2.29",
    "httpx>=0.27",
    "playwright>=1.44",
    "tomli-w>=1.0",
    "lxml>=5.0",
    "pyarrow>=15.0",
    # The model's shipped joblib files are only valid under the scikit-learn that wrote them (loading checks
    # this and says "run `dfs model train`"); bump the pin and retrain together.
    "scikit-learn==1.9.1",
    # Lineup simulator (dfs.sim): normal CDF and its inverse. scikit-learn already needs it; named so a
    # change to scikit-learn cannot silently drop it.
    "scipy>=1.11",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
dfs = "dfs.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: flags typer.Option(...)/typer.Argument(...) as defaults, which is
# Typer's own required, documented pattern for declaring CLI options --
# not a bug to fix, just how this framework works.
ignore = ["B008"]
