name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The versions in uv.lock, not whatever pip picks that day (typer 0.29 broke CI on Nov 11).
      # `--locked` never re-resolves and fails when pyproject.toml and uv.lock disagree (run `uv lock`).
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The FULL suite (the slow builder tests too), on every worker the runner has, a module to a worker.
      - run: uv run pytest --full -n auto --dist loadfile -q
