# Copy this file to config.toml and fill in your own values.
# config.toml is gitignored -- it holds your personal sheet ID and
# credentials filename, neither of which belong in version control.

[google_sheets]
# The ID segment from your sheet's URL:
# https://docs.google.com/spreadsheets/d/<sheet_id>/edit
sheet_id = "your-google-sheet-id"

# Path to your Google service-account credentials JSON, relative to the
# repo root (or an absolute path). See docs/SHEETS_SETUP.md to create one.
credentials_file = "credentials.json"

# Maps each data source to the tab name it should be written to in your
# sheet. Rename the values (right-hand side) to match your own tabs --
# the keys (left-hand side) must stay as-is, they're the source names.
[google_sheets.tab_mappings]
projections = "Projections"
draftkings = "Salaries"
nfl_odds = "Odds"
sos_qb = "SoSQB"
sos_rb = "SoSRB"
sos_wr = "SoSWr"
sos_te = "SoSTE"
sos_dst = "SoSDef"

[nfl_odds]
# Optional overrides. Omit these and the current week/season are
# computed automatically from the NFL schedule.
# default_week = 1
# default_season = 2025

[lineups]
# The tab where you pair finished lineups to DK contest entries (Entry ID,
# Contest Name, Contest ID, Entry Fee, then the 9 roster slot columns --
# DK's own "bulk edit entries" layout). `dfs export` reads this tab as-is.
upload_tab = "DK Upload"
salary_cap = 50000

# `dfs bankroll sync` appends new contest entries into per-row ledger
# tables that already exist in your bankroll tab (header row + a fixed
# range of data rows, each with its own "% Paid"/"Place %" formulas
# already built in). It only ever writes into entry_key_column and the
# 8 columns immediately after the header (Entry name, Place, Points,
# Winnings, Entries, Entry Fee, Prize Pool, Places Paid) -- it never
# touches formula columns or anything outside first_row..last_row.
# Leave [bankroll.cash]/[bankroll.gpp] out entirely if you don't have
# tables shaped like this; `dfs bankroll sync` will tell you what's
# missing rather than guessing.
[bankroll]
tab = "Bankroll"

[bankroll.cash]
header_row = 16
first_row = 17
last_row = 59
entry_key_column = "L"

[bankroll.gpp]
header_row = 63
first_row = 64
last_row = 149
entry_key_column = "L"
