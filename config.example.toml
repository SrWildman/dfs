# Copy this file to config.toml and fill in your own values.
# config.toml is gitignored -- it holds your personal sheet ID and
# credentials filename, neither of which belong in version control.

[google_sheets]
# The ID segment from your sheet's URL:
# https://docs.google.com/spreadsheets/d/<sheet_id>/edit
sheet_id = "your-google-sheet-id"

# Path to your Google service-account credentials JSON, relative to the
# repo root (or an absolute path). See docs/SHEETS_SETUP.md to create one.
credentials_file = "credentials.json"

# Set automatically by `dfs week new` -- records the sheet_id it just moved
# you off of, so bankroll carryover doesn't need last week's URL pasted in
# again. Not something you should set by hand.
# previous_sheet_id = "..."

# Maps each data source to the tab name it should be written to in your
# sheet. Rename the values (right-hand side) to match your own tabs --
# the keys (left-hand side) must stay as-is, they're the source names.
[google_sheets.tab_mappings]
projections = "Projections"
draftkings = "Salaries"
sleeper = "SleeperRaw"
fantasypros = "FantasyProsRaw"
snaps = "SnapsRaw"
pbp = "TeamMetricsRaw"
nfl_odds = "Odds"
nflverse_games = "GamesRaw"
weather = "WeatherRaw"
tffb_gps = "GPSRaw"
edge = "EdgeRaw"
sos_qb = "SoSQB"
sos_rb = "SoSRB"
sos_wr = "SoSWr"
sos_te = "SoSTE"
sos_dst = "SoSDef"

[nfl_odds]
# Optional overrides. Omit these and the current week/season are
# computed automatically from the NFL schedule.
# default_week = 1
# default_season = 2025

[lineups]
# The tab where you pair finished lineups to DK contest entries (Entry ID,
# Contest Name, Contest ID, Entry Fee, then the 9 roster slot columns --
# DK's own "bulk edit entries" layout). `dfs export` reads this tab as-is.
upload_tab = "DK Upload"
salary_cap = 50000

# Tabs `dfs lineups clear` resets at the start of a new week: Lineups and
# Player Pool have a typed-in Name column (everything else VLOOKUPs off
# it); DK Upload above is a full grid of typed values with no formulas at
# all. All three hold last week's data since a fresh sheet copy doesn't
# reset them on its own.
builder_tab = "Lineups"
player_pool_tab = "Player Pool"

# `dfs bankroll sync` appends new contest entries into per-row ledger
# tables that already exist in your bankroll tab (header row + a fixed
# range of data rows, each with its own "% Paid"/"Place %" formulas
# already built in). It only ever writes into entry_key_column and the
# 8 columns immediately after the header (Entry name, Place, Points,
# Winnings, Entries, Entry Fee, Prize Pool, Places Paid) -- it never
# touches formula columns or anything outside first_row..last_row.
# Leave [bankroll.cash]/[bankroll.gpp] out entirely if you don't have
# tables shaped like this; `dfs bankroll sync` will tell you what's
# missing rather than guessing.
[bankroll]
tab = "Bankroll"

# Round 5, item 7: a hand-entered Betting ledger, above Cash (see
# sheet_bankroll_view.py's module docstring for why above Cash rather than
# below GPP). No entry_key_column -- there's no CSV sync/dedupe for
# hand-typed bets.
[bankroll.bets]
header_row = 16
first_row = 17
last_row = 36

[bankroll.cash]
header_row = 38
first_row = 39
last_row = 83
entry_key_column = "L"

[bankroll.gpp]
header_row = 85
first_row = 86
last_row = 149
entry_key_column = "L"

# The season-level Results log -- NOT reset by a new weekly sheet copy.
# `dfs week new` copies its typed-value columns (Week, Cash Pts/Line, H2H
# Entered/Win, Red/Blue/Black) from the outgoing sheet to the new one, so
# the log keeps accumulating across weekly copies instead of resetting to
# empty every week. The two formula columns already built into each row
# (Cash Results, H2H %) are never touched. Defaults match the canonical
# template; override if your Results tab's row layout differs.
[results]
tab = "Results"
header_row = 1
first_row = 2
last_row = 20

# The lineup simulator (`dfs sim`, and the Typical / Big night / Cash % / Top 1% numbers on Lineups and Suggested).
# `gpp_target` is the FIXED top-end line (the old "190+ %"): it is used with `--fixed-lines`, and until ownership
# publishes. The fixed cash line is NOT set here: it is the median of your typed `Cash Line` in Results.
[sim]
gpp_target = 190

# The lines that move with the slate. A contest's lines sit a stable distance above its FIELD MEAN (the average
# entry score, which is the ownership-weighted sum of the players' points), measured on 20 real standings files:
# Cash % = chance to beat the field mean + double_up_offset, Top 1% = chance to beat the field mean +
# gpp_top1_offset (points). The defaults below are those measurements; docs/SIM.md "Relative lines" has them.
[sim.lines]
double_up_offset = 0.6
gpp_cash_offset = 17.9    # reference only: the min-cash line of a GPP (21-26% paid)
gpp_top10_offset = 31.9   # reference only
gpp_top1_offset = 63.2
# Until Own% publishes there is no field: the simulator then uses fixed lines. Left unset these are the old fixed
# numbers (your season-median typed Cash Line, and gpp_target above); set a number to pin one.
# fallback_cash_line = 147.56
# fallback_top1_line = 190
# Projected Own% (a large-field number) -> the Own% a contest type really has: [projected, expected] points as
# fractions, piecewise-linear, anchored at (0, 0) and (1, 1). Empty = identity. Double-ups are chalkier.
# double_up_own_curve = [[0.05, 0.05], [0.15, 0.39]]
# gpp_own_curve = []

# Which projection the model-driven tools act on: late swap, the Lineups simulator, the Suggested builds and the
# Board's portfolio line. "CalPts" is our corrected projection (TFFB corrected for its known biases and blended with
# Sleeper and FantasyPros); wherever CalPts is blank they fall back to TFFB's ProjPts. TFFB stays visible on every
# tab for comparison. The other choices are "ProjPts" and "AggPts".
[projection]
default = "CalPts"

# Shadow projection sources: tracked in Model Check from their first scored week, but kept OUT of the CalPts blend
# until they have `shadow_min_weeks` scored weeks. They then join through the same inverse-error weighting and
# shrinkage as TFFB, Sleeper and FantasyPros. A name with no column in the scored table yet is never active.
shadow_sources = ["EspnPts", "PropPts"]
shadow_min_weeks = 3

# Contest selection (dfs week close): where to find the two files you download from DraftKings by hand -- the
# contest-entry history export and the per-contest "export full standings" files -- and which double-up's
# standings fill Results' blank Cash Line (a value you typed is never overwritten).
[contests]
downloads_dir = "~/Downloads"
cash_line_series = "NFL GIANT $25 Double Up [Single Entry]"

# The Odds API (the-odds-api.com), for player props. Put your own key here; config.toml is gitignored and the key is
# never printed or committed.
[odds_api]
key = "PASTE-YOUR-KEY-HERE"
# The day of the month your quota renews (your account page on the-odds-api.com). Every pull must fit
# credits left / NFL weekends before this day.
reset_day = 1
